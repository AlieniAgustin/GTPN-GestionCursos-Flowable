spring.profiles.active=dev

flowable.database-schema-update=true
flowable.async-executor-activate=true

# Ruta base de la API REST oficial de Flowable
flowable.process.servlet.path=/process-api

# Backend BFF
backend.base-url=http://localhost:8081
backend.api-key=flowable-secret-key

# Web service de aulas simulado: cantidad de aulas físicas (bajar a 1 para mostrar el escenario 7)
aulas.disponibles=3

# Seed de usuarios y grupos (§3.3). Corre en todos los perfiles; ponelo en false para saltearlo
institucion.seed.enabled=true

# §3.5 Plazos del proceso. Para la demo se pueden bajar a minutos sin tocar el BPMN,
# por property o por variable de entorno (PROCESO_PLAZO_RESPUESTA, PROCESO_FECHA_CURSO_OFFSET).
# Duraciones ISO-8601 de días/horas/minutos/segundos: P5D, PT1M, PT30S.
# plazo-respuesta: espera antes de cada recordatorio (son 2 como máximo).
# fecha-curso-offset: desde la aceptación hasta el inicio del curso, cuando la empresa no manda fecha.
proceso.plazo-respuesta=P5D
proceso.fecha-curso-offset=P7D
