server.port=8080

spring.h2.console.enabled=false

# PostgreSQL (soporta sobreescritura via variables de entorno de Spring Boot o Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:flowable}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:flowable}
spring.datasource.password=${DB_PASSWORD:flowable}
