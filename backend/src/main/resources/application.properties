server.port=8081

flowable.base-url=http://localhost:8080
flowable.username=admin
flowable.password=test
flowable.api-key=flowable-secret-key

# Base de datos de la institucion (enunciado 3.2).
# Comparte el PostgreSQL del stack: el motor usa las tablas ACT_*, la institucion
# usa companies/courses. Se sobreescribe por variables de entorno en docker-compose.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowable}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:flowable}
spring.datasource.password=${DB_PASSWORD:flowable}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
