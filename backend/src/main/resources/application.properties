server.port=8081

flowable.base-url=http://localhost:8080
flowable.username=admin
flowable.password=test
flowable.api-key=flowable-secret-key


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowable}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:flowable}
spring.datasource.password=${DB_PASSWORD:flowable}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.packages-to-scan=com.backend.proxy.controller
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
