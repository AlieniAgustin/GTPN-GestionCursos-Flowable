services:
  postgres:
    image: postgres:15-alpine
    container_name: flowable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: flowable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable -d flowable"]
      interval: 5s
      timeout: 5s
      retries: 5

  flowable-app:
    container_name: flowable-app
    build:
      context: ./flowable
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Dentro de la red de compose el BFF se resuelve por nombre de servicio
      BACKEND_BASE_URL: http://backend:8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    container_name: flowable-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      FLOWABLE_BASE_URL: http://flowable-app:8080
      FLOWABLE_USERNAME: admin
      FLOWABLE_PASSWORD: test
      FLOWABLE_API_KEY: flowable-secret-key
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowable
      DB_USER: flowable
      DB_PASSWORD: flowable
    depends_on:
      postgres:
        condition: service_healthy
      flowable-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  flowable-ui:
    image: flowable/flowable-ui:latest
    container_name: flowable-ui
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      postgres:
        condition: service_healthy
      flowable-app:
        condition: service_healthy

volumes:
  postgres_data:
